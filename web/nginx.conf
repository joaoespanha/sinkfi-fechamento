# Limite por IP (ADR 0005). Vive na memória deste nginx: não segura ataque distribuído.
# Geral: 10 requisições por segundo, com folga para a tela carregar de uma vez.
limit_req_zone $binary_remote_addr zone=geral:10m rate=10r/s;
# Login: 5 tentativas por minuto. Freia quem tenta adivinhar senha.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;

    # A tela: arquivos estáticos; rota desconhecida cai no index.html (SPA).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # O login, com o limite apertado. Mesmo repasse do bloco de baixo.
    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:8000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A api, sem o prefixo: /api/clientes/... chega como /clientes/...
    location /api/ {
        limit_req zone=geral burst=20 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
