# Limite por IP (ADR 0005). Vive na memória deste nginx: não segura ataque distribuído.
# Geral: 10 requisições por segundo, com folga para a tela carregar de uma vez.
limit_req_zone $binary_remote_addr zone=geral:10m rate=10r/s;
# Login: 5 tentativas por minuto. Freia quem tenta adivinhar senha.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# Este arquivo é um template: na subida, o nginx troca só as variáveis SINKFI_* (NGINX_ENVSUBST_FILTER no Dockerfile).

# A política de conteúdo da tela, e uma mais frouxa só para a documentação da api: o Swagger e o ReDoc do FastAPI
# carregam do jsDelivr, com script e estilo inline. Pelo $request_uri porque o rewrite de /api/ troca o $uri.
map $request_uri $politica_de_conteudo {
    "~^/api/(docs|redoc)([/?]|$)" "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    default "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;

    # Sem a versão no cabeçalho Server nem nas páginas de erro.
    server_tokens off;

    # Atrás de um proxy de TLS, o IP da conexão é sempre o dele, e o limite por IP vira um balde só para todo
    # mundo. O nginx passa a usar o X-Forwarded-For, mas só o que chega do proxy confiável: de qualquer outro
    # endereço, o cabeçalho é ignorado. O padrão, 127.0.0.1/32, não muda nada sem proxy (compose.yaml).
    set_real_ip_from ${SINKFI_PROXY_CONFIAVEL};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Valem para todos os blocos de baixo, que não têm add_header próprio (senão não herdariam).
    # always: vão também no 429 e no 502. O HSTS fica no proxy de TLS.
    add_header Content-Security-Policy $politica_de_conteudo always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # O DNS do Docker, consultado de novo a cada 10s: a api recriada ganha outro IP, e com o
    # nome resolvido só na subida o nginx respondia 502. Só resolve de novo com o nome numa variável.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8000;

    # A tela: arquivos estáticos; rota desconhecida cai no index.html (SPA).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # O login, com o limite apertado. Mesmo repasse do bloco de baixo.
    location = /api/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A api, sem o prefixo: /api/clientes/... chega como /clientes/...
    # Com variável, o proxy_pass não troca o prefixo sozinho: quem tira é o rewrite.
    location /api/ {
        limit_req zone=geral burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
