[project]
name = "sinkfi-backend"
version = "0.1.0"
description = "Back-end do fechamento da sinkfi: regra pura, repositórios, api e worker"
readme = "README.md"
authors = [
    { name = "joaoespanha", email = "jpbesr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "testcontainers[postgres]>=4.9",
]

[tool.uv.build-backend]
module-name = ["fechamento", "sinkfi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
