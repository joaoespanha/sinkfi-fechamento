services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sinkfi
      POSTGRES_PASSWORD: sinkfi
      POSTGRES_DB: sinkfi
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinkfi -d sinkfi"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Roda as migrações e termina. É o passo que iria para produção como está:
  # nenhum serviço de aplicação migra o banco ao subir.
  migrar:
    build: ./backend
    command: ["python", "-m", "sinkfi.migrar"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinkfi:sinkfi@postgres:5432/sinkfi
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Só existe na demonstração: cria a Marina, ingere os CSVs de dados/ e roda o
  # fechamento de 10/11. Em produção o cliente nasce por cadastro e a ingestão
  # chega pela api. Pode rodar de novo: nada se repete.
  semear:
    build: ./backend
    command: ["python", "-m", "sinkfi.semear"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinkfi:sinkfi@postgres:5432/sinkfi
      PASTA_DADOS: /dados
    volumes:
      - ./dados:/dados:ro
    depends_on:
      migrar:
        condition: service_completed_successfully
    restart: "no"

  # O broker do Celery (ADR 0004). As portas ficam só no host: a 5672 serve à api
  # rodando fora do compose, e o painel na 15672 mostra a fila e a dead letter.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda os pedidos da fila `fechamento`. Não guarda estado: pode ter várias cópias.
  # A pasta de dados tem uma subpasta por cliente; na demonstração, só a da Marina.
  worker:
    build: ./backend
    command: ["celery", "-A", "sinkfi.tarefas", "worker", "-Q", "fechamento,outbox", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinkfi:sinkfi@postgres:5432/sinkfi
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      PASTA_DADOS: /dados
      # Só na demonstração: o corte de 10/11, com que os CSVs batem. Vazio, vale o fechamento vigente.
      SINKFI_CORTE_FIXO: ${SINKFI_CORTE_FIXO-2026-11-10T18:00:00-03:00}
    volumes:
      - ./dados:/dados/cli_marina:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully

  # Agenda a ingestão de cada cliente a cada 6 horas. Exatamente uma cópia:
  # duas agendariam tudo em dobro.
  beat:
    build: ./backend
    command: ["celery", "-A", "sinkfi.tarefas", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinkfi:sinkfi@postgres:5432/sinkfi
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy

  # A api de leitura. Não publica porta: quem fala com ela é o nginx do `web`.
  # O root-path faz o /docs funcionar atrás do prefixo /api.
  api:
    build: ./backend
    command: ["uvicorn", "sinkfi.api:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    environment:
      DATABASE_URL: postgresql+psycopg://sinkfi:sinkfi@postgres:5432/sinkfi
      # Assina o cookie de sessão (ADR 0005). O padrão só serve à demonstração.
      JWT_SECRET: ${JWT_SECRET:-segredo-da-demonstracao-troque-fora-dela}
      # O reprocessar só enfileira; quem roda é o worker.
      BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      migrar:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # A tela, servida pelo nginx, que também repassa /api para a api.
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
      migrar:
        condition: service_completed_successfully

volumes:
  postgres:
